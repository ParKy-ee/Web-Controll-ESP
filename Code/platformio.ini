; PlatformIO Project Configuration File for PlanKO ESP32 Controller
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = gateway

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 1
monitor_rts = 0
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.2
    knolleary/PubSubClient @ ^2.8
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; ==============================================================================
; 1. GATEWAY (BLE Central + Wi-Fi, MQTT, Dataset HTTP Server)
; ==============================================================================
[env:gateway]
upload_port = COM10
monitor_port = COM10
monitor_filters = esp32_exception_decoder
build_src_flags =
    -Wformat=2
    -Werror=format
build_flags = 
    ${env.build_flags}
    -DROLE_GATEWAY

; ==============================================================================
; 2. IMU NODES 1 - 4 (BLE Peripheral + MPU-6050 IMU Sensor)
; ==============================================================================
[env:imu_node_1]
upload_port = COM8
monitor_port = COM8
build_flags =
    ${env.build_flags}
    -DROLE_NODE
    -DNODE_ID=1
    -DENABLE_NODE1_MAX30102=0
lib_ignore = SparkFun MAX3010x Pulse and Proximity Sensor Library

[env:imu_node_2]
upload_port = COM9
monitor_port = COM9
build_flags =
    ${env.build_flags}
    -DROLE_NODE
    -DNODE_ID=2

[env:imu_node_3]
build_flags =
    ${env.build_flags}
    -DROLE_NODE
    -DNODE_ID=3

[env:imu_node_4]
build_flags =
    ${env.build_flags}
    -DROLE_NODE
    -DNODE_ID=4

; Standalone RFP605-only target; it does not run the Gateway or BLE scanner.
; GPIO32 is the mux SIG/ADC input; GPIO16-19 drive S0-S3.
[env:rfp605_sandbox]
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter =
    +<rfp605_sandbox.cpp>
lib_deps =
build_flags =
    -DRFP605_SANDBOX
    -DRFP605_ADC_PIN=32
    -DRFP605_MUX_S0_PIN=16
    -DRFP605_MUX_S1_PIN=17
    -DRFP605_MUX_S2_PIN=18
    -DRFP605_MUX_S3_PIN=19
    -DRFP605_ACTIVE_MASK=0xF801
    -DRFP605_CALIBRATION_SAMPLES=20
    -DRFP605_PRESS_DELTA_RAW=100
    -DRFP605_RELEASE_DELTA_RAW=50
    -DRFP605_MAX_PRESS_DELTA_RAW=300
    -DRFP605_MAX_RELEASE_DELTA_RAW=150
    -DRFP605_DEBUG_SCAN=0
